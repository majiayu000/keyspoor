[package]
name = "keyspoor"
version = "0.1.4"
edition = "2024"
rust-version = "1.96"
description = "Offline secret scanner and Rust library for Git, CI and AI agents, with MCP, JSONL and SARIF"
repository = "https://github.com/majiayu000/keyspoor"
homepage = "https://majiayu000.github.io/keyspoor/"
documentation = "https://docs.rs/keyspoor"
readme = "README.md"
keywords = ["secret-scanning", "security", "credentials", "mcp", "git"]
categories = ["command-line-utilities", "development-tools"]
license = "Apache-2.0"
include = ["/src/**", "/tests/**", "/examples/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/README.zh-CN.md", "/LICENSE", "/THIRD_PARTY_NOTICES"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
aho-corasick = "1"
base64 = "0.22"
regex = "1"
regex-syntax = "0.8"
ra-ap-rustc_lexer = "0.178"
# The lexer requires matching Unicode 17 tables in ident and properties.
unicode-ident = "=1.0.24"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
